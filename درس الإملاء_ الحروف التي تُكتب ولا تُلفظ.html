<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>الحروف التي تُكتب ولا تُلفظ</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff7fb;--card:#fff;--ink:#3b2a4a;--mut:#7a6a8a;--pk:#ff6fa8;--pu:#8e63e8;--tl:#27c3b0;--yl:#ffc93c;--rd:#e5365f;--ok:#2fb86b;--ln:#f0d9ea}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1528;--card:#2a1f3a;--ink:#f6eefc;--mut:#bba9cf;--ln:#44345a}}
:root[data-theme="dark"]{--bg:#1d1528;--card:#2a1f3a;--ink:#f6eefc;--mut:#bba9cf;--ln:#44345a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:18px;line-height:1.7}
header{background:linear-gradient(135deg,var(--pk),var(--pu));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:clamp(20px,5vw,30px);flex:1;min-width:180px}
header small{display:block;font-weight:400;font-size:14px;opacity:.9}
.pill{background:rgba(255,255,255,.25);border:0;color:#fff;border-radius:20px;padding:4px 12px;font:inherit;font-weight:700;cursor:pointer}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;max-width:100%}
nav button{flex:0 0 auto;border:2px solid var(--ln);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer}
nav button.on{background:var(--pu);color:#fff;border-color:var(--pu)}
nav small{opacity:.8}
main{max-width:760px;margin:0 auto;padding:6px 12px 40px}
.card{background:var(--card);border:2px solid var(--ln);border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 6px 0 var(--ln)}
.c{text-align:center}.big{font-size:56px}
h2,h3{margin:.2em 0}
.word{font-size:clamp(40px,12vw,64px);font-weight:900;text-align:center;margin:6px 0}
.sl{color:var(--rd);background:rgba(229,54,95,.15);border-radius:8px;text-decoration:underline wavy;opacity:.8}
.q{font-weight:700;font-size:20px}.pg{color:var(--mut);font-size:14px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.opt,.btn{border:3px solid var(--ln);background:var(--card);color:var(--ink);border-radius:18px;padding:12px;font:inherit;font-weight:900;font-size:22px;cursor:pointer;transition:transform .1s}
.opt:active,.btn:active{transform:scale(.96)}
.btn{background:var(--tl);color:#fff;border-color:var(--tl);font-size:18px;margin-top:10px}
.ear{border:0;background:var(--yl);color:#3b2a4a;border-radius:16px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.no{background:var(--rd);color:#fff;border-color:var(--rd);animation:sh .4s}
.fb{min-height:28px;margin-top:8px;font-weight:700;color:var(--ok)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{flex:1;min-width:120px;border:3px solid var(--ln);background:var(--card);color:var(--ink);border-radius:16px;padding:8px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--pk);border-color:var(--pk);color:#fff}
.rule{background:linear-gradient(135deg,rgba(255,201,60,.25),rgba(39,195,176,.2));border-radius:16px;padding:10px 14px;font-weight:700}
.wg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.wc{border:2px dashed var(--pu);border-radius:18px;padding:8px;text-align:center}
.wc .word{font-size:clamp(34px,9vw,46px)}
.pr{color:var(--mut);font-size:15px}
.ch{display:inline-block;background:var(--pu);color:#fff;border-radius:50%;width:34px;height:34px;line-height:34px;text-align:center;margin:3px;font-weight:900}
.cf{position:fixed;top:-40px;animation:fall 2s linear forwards;pointer-events:none;z-index:9}
.pop{position:fixed;inset:35% 0 auto;text-align:center;font-size:44px;font-weight:900;color:var(--pk);text-shadow:0 3px 0 #fff;pointer-events:none;z-index:10;animation:pp 1.2s forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
@keyframes pp{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
.cert{border:6px double var(--yl);border-radius:22px;padding:16px;text-align:center;background:var(--card)}
input{font:inherit;font-size:20px;border:3px solid var(--ln);border-radius:14px;padding:6px 12px;width:80%;max-width:300px;background:var(--card);color:var(--ink);text-align:center}
</style></head><body>
<header>
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" fill="#ffc93c"/><circle cx="22" cy="27" r="4" fill="#3b2a4a"/><circle cx="42" cy="27" r="4" fill="#3b2a4a"/><circle cx="16" cy="38" r="5" fill="#ff8fb8" opacity=".8"/><circle cx="48" cy="38" r="5" fill="#ff8fb8" opacity=".8"/><rect x="29" y="38" width="6" height="18" rx="3" fill="#fff" stroke="#3b2a4a" stroke-width="2"/></svg>
<h1>الحروف الخجولة 🤫<small>الحروف التي تُكتب ولا تُلفظ · الصف الرابع</small></h1>
<span class="pill" id="sc">⭐ 0</span><button class="pill" id="tm">⏱ ابدئي المؤقت</button>
</header>
<nav id="nav"></nav><main id="app"></main>
<script>
const $=s=>document.querySelector(s),S=[{t:"تهيئة",m:5,i:"🌟"},{t:"الشرح",m:12,i:"📖"},{t:"سلة الكلمات",m:13,i:"🧺"},{t:"تدريب",m:12,i:"🔍"},{t:"الإملاء",m:5,i:"✏️"},{t:"الختام",m:3,i:"🏆"}];
let step=0,score=0,done=new Set(),tm=null,left=0;
const fmt=w=>w.replace(/\[(.)\]/g,'<span class="sl">$1</span>'),plain=w=>w.replace(/[\[\]]/g,'');
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let ac;function ctx(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
function clap(){const c=ctx();if(!c)return;for(let i=0;i<14;i++){const t=c.currentTime+i*.09+Math.random()*.05,b=c.createBuffer(1,c.sampleRate*.08,c.sampleRate),d=b.getChannelData(0);for(let j=0;j<d.length;j++)d[j]=(Math.random()*2-1)*Math.pow(1-j/d.length,3);const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=1800+Math.random()*1500;g.gain.value=.7;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)}}
function oops(){const c=ctx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.frequency.value=200;g.gain.setValueAtTime(.15,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.3);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.3)}
function party(){const e=['⭐','🎉','🌸','✨','💖','🎈'],P=['أحسنتِ! 👏','ممتازة! 🌟','رائعة! 👏','برافو! 🎉'];for(let i=0;i<22;i++){const s=document.createElement('span');s.className='cf';s.textContent=e[i%6];s.style.left=Math.random()*95+'vw';s.style.animationDelay=Math.random()*.4+'s';s.style.fontSize=(18+Math.random()*18)+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}const p=document.createElement('div');p.className='pop';p.textContent=P[Math.floor(Math.random()*4)];document.body.appendChild(p);setTimeout(()=>p.remove(),1300);clap()}
const YN=["🤫 فيها حرف خجول","🔊 تُلفظ كل حروفها"];
const Q0=[{q:"اسمعي كلمة «الشمس» 🔊 هل تسمعين صوت اللام؟",say:"الشمس",o:["نعم، أسمعها","لا، اللام تختبئ 🤫"],a:1,fb:"نكتب «الشمس» باللام لكن نقول «أَشّمس»"},
{q:"واسمعي «القمر» 🔊 هل تسمعين اللام هذه المرة؟",say:"القمر",o:["نعم، أسمعها","لا، لا أسمعها"],a:0,fb:"في «القمر» اللام تُلفظ"},
{q:"«كتبوا» 🔊 هل تسمعين الألف في آخرها؟",say:"كتبوا",o:["نعم أسمعها","لا، الألف خجولة 🤫"],a:1,fb:"الألف تُكتب ولا تُلفظ"}];
const Q2=[["الشمس",0,"لام شمسية: اللام تُكتب ولا تُلفظ"],["كتاب",1,"كل حروفها تُلفظ"],["لعبوا",0,"ألف واو الجماعة"],["القمر",1,"لام قمرية: اللام تُلفظ"],["عمرو",0,"الواو في «عمرو» لا تُلفظ"],["مدرسة",1,"كل حروفها تُلفظ"],["مائة",0,"ألف «مائة» لا تُلفظ"],["النهر",0,"لام شمسية قبل النون"]].map(x=>({q:"في هذه الكلمة…",w:x[0],say:x[0],o:YN,a:x[1],fb:x[2]}));
const Q3=[{q:"ما الحرف الذي يُكتب ولا يُلفظ؟",w:"النجوم",o:["ن","ل","ج"],a:1,fb:"اللام الشمسية"},{q:"ما الحرف الذي يُكتب ولا يُلفظ؟",w:"ذهبوا",o:["ب","و","ا"],a:2,fb:"ألف واو الجماعة"},{q:"ما الحرف الذي يُكتب ولا يُلفظ؟",w:"عمرو",o:["ع","م","و"],a:2,fb:"واو عمرو"},{q:"ما الحرف الذي يُكتب ولا يُلفظ؟",w:"خمسمائة",o:["ا","م","ئ"],a:0,fb:"ألف مائة"},
{q:"الأولاد ____ في الحديقة",o:["لعبو","لعبوا"],a:1,fb:"نكتب ألفًا بعد واو الجماعة",sh:1},{q:"أشرقت ____ صباحًا",o:["الشمس","اشمس"],a:0,fb:"نكتب «ال» ولو لم نلفظ اللام",sh:1},{q:"اشترى أبي كتابًا بـ ____ درهم",o:["مائة","مأة"],a:0,fb:"نكتب «مائة» بالألف",sh:1}];
const Q4=[["الشمس","اشمس","شمس"],["كتبوا","كتبو","كتبوه"],["عمرو","عمر","عمور"]].map(x=>({q:"اسمعي ثم اختاري الكتابة الصحيحة ✏️",say:x[0],auto:1,o:x,a:0,fb:"أحسنتِ، كتبتِها صحيحة!",sh:1}));
const TOTAL=Q0.length+Q2.length+Q3.length+Q4.length;
const R=[{n:"اللام الشمسية",ic:"☀️",r:"إذا جاءت «ال» قبل حرف شمسي تُكتب اللام ولا تُلفظ، ونلفظ الحرف الشمسي مشدّدًا.",w:[["ا[ل]شمس","اَشّمس"],["ا[ل]نور","اَنّور"],["ا[ل]تاجر","اَتّاجر"],["ا[ل]صباح","اَصّباح"]]},
{n:"ألف واو الجماعة",ic:"👭",r:"نكتب ألفًا بعد واو الجماعة في آخر الفعل، ولا نلفظها.",w:[["كتبو[ا]","كَتَبُو"],["ذهبو[ا]","ذَهَبُو"],["لعبو[ا]","لَعِبُو"],["رسمو[ا]","رَسَمُو"]]},
{n:"واو عمرو",ic:"🧒",r:"نكتب واوًا في آخر اسم «عمرو» لنفرّق بينه وبين «عُمَر»، ولا نلفظها.",w:[["عمر[و]","عَمْر"],["جاء عمر[و] مبكرًا","جاءَ عَمْر مبكرًا"]]},
{n:"ألف مائة",ic:"💯",r:"نكتب ألفًا في كلمة «مائة» ولا نلفظها.",w:[["م[ا]ئة","مِئة"],["خمسم[ا]ئة","خَمسُمِئة"]]}];
const SH="ت ث د ذ ر ز س ش ص ض ط ظ ل ن".split(" ");
function nav(){$('#nav').innerHTML=S.map((s,i)=>`<button class="${i==step?'on':''}" data-i="${i}">${s.i} ${s.t} <small>${s.m}د</small></button>`).join('');}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
function go(n){step=n;nav();scrollTo(0,0);const a=$('#app');a.innerHTML='';
 if(n==0){a.innerHTML=`<div class="card c"><div class="big">🤫</div><h2>من هي الحروف الخجولة؟</h2><p>حروف تظهر في الكتابة… لكنها تختبئ عندما ننطق الكلمة!<br>اليوم سنكتشفها معًا ونصطادها 🔍</p></div><div id="q"></div>`;quiz($('#q'),Q0,0,nxt)}
 else if(n==1)explain(0);
 else if(n==2){a.innerHTML=`<div class="card c"><b>🧺 صنّفي الكلمة:</b> هل فيها حرف خجول أم تُلفظ كل حروفها؟</div><div id="q"></div>`;quiz($('#q'),Q2,100,nxt)}
 else if(n==3){a.innerHTML=`<div class="card c"><b>🔍 اصطادي الحرف الخجول وأكملي الجمل</b></div><div id="q"></div>`;quiz($('#q'),Q3,200,nxt)}
 else if(n==4){a.innerHTML=`<div class="card c"><b>✏️ المعلمة تُملي، وأنتِ تكتبين في دفترك، ثم تتحققين هنا</b></div><div id="q"></div>`;quiz($('#q'),Q4,300,nxt)}
 else end()}
function nxt(el){const b=document.createElement('button');b.className='btn';b.textContent='التالي ⬅️';b.onclick=()=>go(step+1);el.appendChild(b)}
function quiz(el,items,base,fin){let i=0;(function show(){
 if(i>=items.length){el.innerHTML=`<div class="card c"><div class="big">🎊</div><h3>أنهيتِ هذا التدريب!</h3></div>`;fin(el.firstChild);return}
 const it=items[i],ord=it.o.map((_,k)=>k);if(it.sh)ord.sort(()=>Math.random()-.5);
 el.innerHTML=`<div class="card"><div class="pg">سؤال ${i+1} من ${items.length}</div><div class="q">${it.q}</div>${it.w?`<div class="word">${it.w}</div>`:''}${it.say?`<button class="ear">🔊 اسمعي</button>`:''}<div class="opts">${ord.map(k=>`<button class="opt" data-k="${k}">${it.o[k]}</button>`).join('')}</div><div class="fb"></div></div>`;
 if(it.say){el.querySelector('.ear').onclick=()=>say(it.say);if(it.auto)setTimeout(()=>say(it.say),400)}
 let tried=0;el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  if(+b.dataset.k==it.a){b.classList.add('ok');el.querySelectorAll('.opt').forEach(x=>x.disabled=true);
   const id=base+i;if(!tried&&!done.has(id)){done.add(id);score++;$('#sc').textContent='⭐ '+score}
   party();el.querySelector('.fb').textContent='✅ '+it.fb;
   const n=document.createElement('button');n.className='btn';n.textContent='التالي ⬅️';n.onclick=()=>{i++;show()};el.querySelector('.card').appendChild(n)}
  else{tried=1;b.classList.add('no');b.disabled=true;oops();el.querySelector('.fb').style.color='var(--rd)';el.querySelector('.fb').textContent='حاولي مرة أخرى 💪'}})})()}
function explain(r){const x=R[r],a=$('#app');
 a.innerHTML=`<div class="tabs">${R.map((y,k)=>`<button class="${k==r?'on':''}" data-r="${k}">${y.ic} ${y.n}</button>`).join('')}</div>
 <div class="card"><h2>${x.ic} ${x.n}</h2><div class="rule">${x.r}</div>
 ${r==0?`<p>الحروف الشمسية: ${SH.map(c=>`<span class="ch">${c}</span>`).join('')}<br><small>أما الحروف القمرية مثل (القمر، الكتاب) فتُلفظ اللام فيها.</small></p>`:''}
 <div class="wg">${x.w.map(w=>`<div class="wc"><div class="word">${fmt(w[0])}</div><div class="pr">تُنطق: ${w[1]}</div><button class="ear" data-s="${plain(w[0])}">🔊</button></div>`).join('')}</div>
 <p class="pr">الحرف الأحمر 🤫 يُكتب ولا يُلفظ</p>
 <button class="btn" id="nx">${r<3?'القاعدة التالية ⬅️':'هيا نتدرّب ⬅️'}</button></div>`;
 a.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>explain(+b.dataset.r));
 a.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(b.dataset.s));
 $('#nx').onclick=()=>r<3?explain(r+1):go(2)}
function end(){const st=Math.round(score/TOTAL*5);
 $('#app').innerHTML=`<div class="cert"><div class="big">🏆</div><h2>شهادة تميّز</h2><input id="nm" placeholder="اكتبي اسمك"><p>الطالبة المبدعة <b id="nn">…</b><br>صادت الحروف الخجولة بنجاح!</p><div class="big">${'⭐'.repeat(st)||'🌱'}</div><p>نتيجتك: ${score} من ${TOTAL}</p></div>
 <div class="card"><h3>ماذا تعلّمنا؟ 🤫</h3><p>${R.map(x=>x.ic+' '+x.n).join(' · ')}</p><p class="rule">حروف خجولة… نراها بالعين ولا نسمعها بالأذن!</p></div>`;
 $('#nm').oninput=e=>$('#nn').textContent=e.target.value||'…';if(score>=TOTAL*.6)party()}
function tick(){$('#tm').textContent='⏱ '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left--<=0){clearInterval(tm);oops();setTimeout(oops,400)}}
$('#tm').onclick=()=>{clearInterval(tm);left=S[step].m*60;tick();tm=setInterval(tick,1000)};
go(0);
</script></body></html>
