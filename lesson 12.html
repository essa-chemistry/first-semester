<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>تعريف الذرة | درس تفاعلي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef6;--sf:#fff;--ink:#1b2437;--mu:#5d6a80;--ln:#d5dcea;--ac:#6d3fc0;--bl:#e8f0ff;--gr:#e6f6ea;--pu:#f0e9fb;--am:#fff4dc;--ok:#157a3d;--bad:#b4232a;--okb:#dcf4e3;--badb:#fde3e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1320;--sf:#161e2e;--ink:#e9eef8;--mu:#9fabc2;--ln:#2a3550;--ac:#b693ff;--bl:#18284a;--gr:#14301f;--pu:#271c42;--am:#3a2e12;--ok:#5dd88a;--bad:#ff8a8f;--okb:#133a25;--badb:#47191d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1320;--sf:#161e2e;--ink:#e9eef8;--mu:#9fabc2;--ln:#2a3550;--ac:#b693ff;--bl:#18284a;--gr:#14301f;--pu:#271c42;--am:#3a2e12;--ok:#5dd88a;--bad:#ff8a8f;--okb:#133a25;--badb:#47191d;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.85 Tajawal,'Segoe UI',Tahoma,sans-serif}
.w{max-width:1080px;margin:auto;padding:12px 14px 40px}
.hd{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,#3b1d7a,#6d3fc0 55%,#2b7de9);color:#fff;border-radius:20px;padding:14px 20px}
.hd h1{margin:0;font-size:1.7rem;font-weight:800}.hd p{margin:0;opacity:.85;font-size:.95rem}
.gp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}.gp>b{color:var(--mu);font-size:.9rem;min-width:170px}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch button{border:2px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:999px;padding:.2rem .9rem;font:700 .9rem Tajawal,sans-serif;cursor:pointer}
.ch button.on{background:var(--ac);border-color:var(--ac);color:#fff}.ch button.q{border-style:dashed}
.pr{height:5px;background:var(--ln);border-radius:9px;margin:12px 0;overflow:hidden}.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6d3fc0,#2b7de9);transition:width .4s}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;margin:12px 0;animation:fi .5s both}
.pn.bl{background:var(--bl)}.pn.gr{background:var(--gr)}.pn.pu{background:var(--pu)}.pn.am{background:var(--am)}
.pn h3{margin:0 0 6px;font-size:1.12rem;font-weight:800}.pn h3:before{content:"";display:inline-block;width:8px;height:1em;border-radius:4px;background:var(--ac);margin-inline-end:8px;vertical-align:-2px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:0 14px}
.mu{color:var(--mu);font-size:.9rem}.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.gb,.nv button{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;padding:.35rem .9rem;font:700 .95rem Tajawal,sans-serif;cursor:pointer}
.gb.on{background:var(--ac);color:#fff;border-color:var(--ac)}.gb:disabled{opacity:.45}
.sw{display:flex;gap:6px;align-items:center;font-weight:700;cursor:pointer}
canvas{width:100%;height:auto;display:block;border-radius:12px;background:#f8fbff;border:1px solid var(--ln)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips>div{flex:1 1 150px;background:var(--sf);border-radius:12px;padding:8px 12px;font-size:.9rem;line-height:1.5}.chips b{display:block;font-size:1.25rem;color:var(--ac)}
.rul{display:flex;align-items:center;gap:8px;direction:ltr}.rul>i{display:block;width:0;height:14px;border-radius:7px;background:linear-gradient(90deg,#f59e0b,#ea580c);transition:width 2.2s ease;flex:none}.rul{background:var(--sf);border-radius:8px;padding:6px;border:1px dashed var(--ln)}
#cu{display:grid;gap:3px;width:200px;aspect-ratio:1;margin:8px auto}#cu span{background:linear-gradient(135deg,#f4a261,#b45309);border-radius:3px;animation:pop .45s both}#cu span.at{border-radius:50%;background:radial-gradient(circle at 30% 30%,#fcd9a8,#c2570c)}
.stg{position:relative;height:210px;background:var(--sf);border-radius:14px;border:1px solid var(--ln);overflow:hidden}.stg>*{position:absolute;inset:0;margin:auto;max-width:none}
#zd{background:radial-gradient(circle at 30% 30%,#93c5fd,#1d4ed8);border-radius:50%}
.scan{position:relative;overflow:hidden;border-radius:12px;max-width:300px;margin:auto}.scan img{display:block;width:100%}.scan i{position:absolute;left:0;right:0;height:6px;background:rgba(255,255,255,.85);box-shadow:0 0 14px 4px #fff;animation:scn 3s ease-in-out infinite alternate}
figure{margin:8px 0}figure img{display:block;max-width:100%;border-radius:10px;margin:auto;background:#fff}figcaption{text-align:center;color:var(--mu);font-size:.85rem}
.brt{animation:br 4s ease-in-out infinite}
#gd{display:grid;grid-template-columns:repeat(46,1fr);gap:2px;max-width:420px;margin:8px auto}#gd i{aspect-ratio:1;background:#cbd5e1;border-radius:50%}#gd i.e{background:#ef4444;animation:blk 1s infinite;box-shadow:0 0 6px 2px #ef4444}
.tl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tl button{border:2px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;padding:.2rem .7rem;font:800 .9rem Tajawal,sans-serif;cursor:pointer;direction:ltr}.tl button.on{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-3px)}
.tc{background:var(--sf);border-radius:12px;padding:10px 14px;min-height:92px}.tc b{color:var(--ac)}
table{border-collapse:collapse;width:100%;font-size:.88rem;text-align:center}th{background:var(--ac);color:#fff;padding:6px}td{padding:6px;border:1px solid var(--ln);background:var(--sf)}
.stp{display:flex;align-items:center;gap:8px;margin:4px 0}.stp span{min-width:110px;font-weight:700}.stp button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);font:800 1.1rem sans-serif;cursor:pointer}.stp b{min-width:2ch;text-align:center;font-size:1.2rem}
.bar{background:var(--ln);border-radius:8px;height:26px;margin:6px 0;overflow:hidden;direction:ltr}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ef4444,#f59e0b);color:#fff;font:700 .8rem/26px Tajawal,sans-serif;padding:0 8px;white-space:nowrap}
.fq{background:var(--pu);border:2px dashed var(--ac);border-radius:14px;padding:10px 14px;margin:12px 0}.fq:before{content:"✦ لنتأكد من الفهم";display:block;color:var(--ac);font-weight:800;font-size:.85rem}.fq.qz:before{content:none}.fq.qz{border-style:solid;border-color:var(--ln);background:var(--sf)}
.fo-w{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:8px}.fo{border:2px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:.4rem .8rem;font:700 .95rem Tajawal,sans-serif;cursor:pointer;text-align:start}
.fo.ok{border-color:var(--ok);background:var(--okb)}.fo.no{border-color:var(--bad);background:var(--badb)}.fe{display:none;margin-top:8px;padding:8px 12px;border-radius:10px;font-size:.92rem}.fq[data-d] .fe{display:block}.fq.g .fe{background:var(--okb)}.fq.x .fe{background:var(--badb)}
.sc{font-size:1.4rem;font-weight:800;text-align:center;padding:14px;border-radius:14px;background:var(--okb);margin:12px 0}
.nv{display:flex;justify-content:space-between;align-items:center;margin-top:16px}.nv button{background:var(--ac);color:#fff;border-color:var(--ac)}
@keyframes fi{from{opacity:0;transform:translateY(12px)}}@keyframes pop{from{transform:scale(.2);opacity:0}}@keyframes scn{from{top:0}to{top:calc(100% - 6px)}}
@keyframes br{50%{transform:scale(1.05)}}@keyframes blk{50%{opacity:.3}}@keyframes wb{50%{transform:translate(var(--dx),var(--dy))}}@keyframes pl{50%{opacity:.9}}
.wb{animation:wb 3s ease-in-out infinite}.pl{animation:pl 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

{t:'أنبوب أشعة المهبط',h:()=>`
<div class="pn"><h3>جرّب بنفسك: أنبوب أشعة المهبط</h3><canvas id="tb"></canvas><div class="ctl"><label class="sw"><input type="checkbox" id="tp" checked>تشغيل البطارية</label><label class="sw"><input type="checkbox" id="te">صفيحتان مشحونتان (مجال كهربائي)</label><label class="sw"><input type="checkbox" id="tm">مغناطيس (مجال مغناطيسي)</label></div><p id="tn" class="mu"></p></div>
<div class="g2"><div class="pn gr"><h3>ماذا نتعلم؟</h3><p>• يُفرَّغ الأنبوب الزجاجي من الهواء ويُمرَّر فيه تيار كهربائي بين قطبين.<br>• القطب الموصول بالطرف <b>السالب</b> للبطارية هو <b>المهبط (الكاثود)</b>، والموصول بالطرف <b>الموجب</b> هو <b>المصعد (الأنود)</b>.<br>• الشعاع الخارج من المهبط إلى المصعد سُمّي <b>أشعة المهبط</b> وأدى اكتشافه إلى اختراع التلفاز.<br>• لا يتغير الشعاع بتغيير معدن الأقطاب أو الغاز، فالجسيمات السالبة (الإلكترونات ${bd('e⁻')}) موجودة في جميع أشكال المادة.</p></div>
<div class="pn"><h3>من الكتاب</h3><figure><img src="${IM.tube}" alt=""><figcaption>الشكل 6-3</figcaption></figure><figure><img src="${IM.fig7}" alt=""><figcaption>الشكل 7-3: تجارب تحديد خواص أشعة المهبط</figcaption></figure></div></div>
${FQ('انحراف أشعة المهبط نحو الصفيحة الموجبة يدل على أن جسيماتها','سالبة الشحنة',['موجبة الشحنة','متعادلة','عديمة الكتلة'],'الشحنة السالبة تنجذب إلى القطب الموجب.')}${FQ('القطب الموصول بالطرف السالب للبطارية يسمى','المهبط (الكاثود)',['المصعد (الأنود)','الفوسفور','المغناطيس'],'المهبط = السالب، المصعد = الموجب.')}`,
 i:()=>{const x=C2('tb',800,340),P=[];let f=0;
  const dy=px=>{const u=Math.max(0,px-330),s=Math.min(u,140),d=s*s/1400+(u-s)*s/700;return($('#te').checked?-d:0)+($('#tm').checked?d*.8:0)};
  const lb=(t,a,b,c='#334155')=>{x.fillStyle=c;x.fillText(t,a,b)};
  run(()=>{f++;const on=$('#tp').checked,E=$('#te').checked,M=$('#tm').checked;
   $('#tn').textContent=!on?'شغّل البطارية لتنطلق الإلكترونات.':E?'انحرفت الأشعة نحو الصفيحة الموجبة ⟸ جسيماتها سالبة الشحنة.':M?'انحرفت الأشعة في المجال المغناطيسي ⟸ جسيماتها مشحونة.':'تنتقل الأشعة من المهبط إلى المصعد في خط مستقيم.';
   x.clearRect(0,0,800,340);x.font='700 16px Tajawal,sans-serif';x.textAlign='center';
   x.fillStyle='#dbeafe';x.strokeStyle='#60a5fa';x.lineWidth=3;x.fillRect(60,100,690,140);x.strokeRect(60,100,690,140);
   x.fillStyle='#64748b';x.fillRect(66,112,14,116);x.fillRect(620,112,12,34);x.fillRect(620,194,12,34);
   lb('المهبط −',74,92);lb('المصعد +',626,92);lb('شاشة فوسفورية',705,262);
   x.strokeStyle='#475569';x.lineWidth=2;x.beginPath();x.moveTo(73,228);x.lineTo(73,312);x.lineTo(330,312);x.moveTo(420,312);x.lineTo(626,312);x.lineTo(626,228);x.stroke();
   x.fillStyle='#1d4ed8';x.fillRect(330,298,90,30);lb('بطارية',375,319,'#fff');
   if(E){x.fillStyle='#ef4444';x.fillRect(330,114,140,9);x.fillStyle='#2563eb';x.fillRect(330,217,140,9);lb('+',400,112,'#ef4444');lb('−',400,246,'#2563eb')}
   if(M){x.fillStyle='#dc2626';x.fillRect(350,30,100,52);x.fillStyle='#2563eb';x.fillRect(350,258,100,0);x.fillStyle='#2563eb';x.fillRect(350,248,100,0);lb('N',400,64,'#fff');x.fillStyle='#2563eb';x.fillRect(350,250,100,0)}
   if(on&&f%4==0)P.push({x:84,j:(Math.random()-.5)*30});
   const hy=170+dy(738);if(on){const g=x.createRadialGradient(742,hy,2,742,hy,44);g.addColorStop(0,'rgba(74,222,128,.95)');g.addColorStop(1,'rgba(74,222,128,0)');x.fillStyle=g;x.fillRect(690,100,60,140)}
   for(let k=P.length-1;k>=0;k--){const p=P[k];p.x+=5;if(p.x>738){P.splice(k,1);continue}const y=170+p.j+dy(p.x);x.fillStyle='#2563eb';x.shadowColor='#60a5fa';x.shadowBlur=8;x.beginPath();x.arc(p.x,y,4,0,7);x.fill();x.shadowBlur=0}
   if(M){x.fillStyle='#2563eb';x.fillRect(350,258,100,0)}})}},
{t:'الإلكترون: كتلته وشحنته',h:()=>`
<div class="g2"><div class="pn bl"><h3>نسبة الشحنة إلى الكتلة (طومسون)</h3><p>قاس طومسون تأثير المجالين المغناطيسي والكهربائي في أشعة المهبط وحدّد نسبة شحنتها إلى كتلتها، فاستنتج أن كتلة الجسيم المشحون <b>أقل كثيرًا</b> من كتلة ذرة الهيدروجين؛ أي أن الذرة يمكن تجزئتها وأن دالتون كان مخطئًا. نال جائزة نوبل عام 1906م.</p><div id="gd"></div><p class="mu" style="text-align:center">كل نقطة رمادية = كتلة تعادل إلكترونًا. ذرة الهيدروجين = ${bd('1840')} نقطة، والإلكترون النقطة الحمراء الوحيدة.</p></div>
<div class="pn"><h3>تجربة قطرة الزيت (مليكان 1910م)</h3><canvas id="ml"></canvas><div class="ctl"><button class="gb" id="m1">＋ إلكترون</button><button class="gb" id="m2">－ إلكترون</button><button class="gb" id="m3">⚖ ثبّت القطرة</button></div><label class="sw">المجال الكهربائي <input type="range" id="mE" min="0" max="100" value="30" dir="ltr" style="flex:1"></label><p id="mS" style="margin:4px 0"></p><p id="mQ" class="mu" style="margin:0"></p></div></div>
<div class="g2"><div class="pn gr"><h3>النتيجة</h3><p>الشحنة على القطرة تزداد دائمًا <b>بكميات محددة</b>، وأبسط مقدار مشترك هو ${bd('1.602×10⁻¹⁹')} كولوم = شحنة إلكترون واحد (−1). ومن نسبة الشحنة إلى الكتلة حُسبت كتلته: ${bd('9.1×10⁻²⁸ g')} أي ${bd('1/1840')} من كتلة ذرة الهيدروجين.</p></div><div class="pn"><figure><img src="${IM.mill}" alt=""><figcaption>الشكل 8-3: جهاز مليكان</figcaption></figure></div></div>
${FQ('كتلة الإلكترون مقارنة بذرة الهيدروجين','1/1840',['1/18','1840 مرة أكبر','مساوية'],'الإلكترون أخف بنحو 1840 مرة من ذرة الهيدروجين.')}${FQ('الشحنة الموجودة على كل قطرة زيت عند مليكان','مضاعفات صحيحة لشحنة الإلكترون',['أي قيمة عشوائية','دائمًا موجبة','صفر'],'ازدادت الشحنة بكميات محددة، فاستُنتجت شحنة الإلكترون.')}`,
 i:()=>{$('#gd').innerHTML=Array.from({length:1840},(_,i)=>`<i class="${i===1010?'e':''}"></i>`).join('');
  const x=C2('ml',760,330);let n=2,y=170,ls='',bg=Array.from({length:18},()=>({x:210+Math.random()*340,y:90+Math.random()*160,v:.1+Math.random()*.25}));
  const ar=(a,b,c,k)=>{x.strokeStyle=c;x.fillStyle=c;x.lineWidth=3;x.beginPath();x.moveTo(a,b);x.lineTo(a,b+k);x.stroke();const s=k<0?1:-1;x.beginPath();x.moveTo(a,b+k);x.lineTo(a-6,b+k+s*9);x.lineTo(a+6,b+k+s*9);x.fill()};
  const q=()=>$('#mQ').innerHTML=`شحنة القطرة = ${bd(n+' × 1.602×10⁻¹⁹ C = '+(n*1.602).toFixed(3)+'×10⁻¹⁹ C')}`;
  $('#m1').onclick=()=>{n=Math.min(5,n+1);q()};$('#m2').onclick=()=>{n=Math.max(1,n-1);q()};$('#m3').onclick=()=>$('#mE').value=Math.round(60/n);q();
  run(()=>{const E=+$('#mE').value,net=n*E/60-1;y=Math.max(100,Math.min(240,y+Math.max(-3,Math.min(3,-net*2.4))));
   const s=net>.04?'تصعد: القوة الكهربائية أكبر من الوزن.':net<-.04?'تهبط: الوزن أكبر من القوة الكهربائية.':'معلّقة: القوة الكهربائية = الوزن.';if(s!==ls){ls=s;$('#mS').textContent=s}
   x.clearRect(0,0,760,330);x.fillStyle='#b45309';x.fillRect(180,58,400,14);x.fillStyle='#15803d';x.fillRect(180,262,400,14);x.font='800 18px Tajawal,sans-serif';x.fillStyle='#b45309';x.fillText('+ صفيحة موجبة',590,70);x.fillStyle='#15803d';x.fillText('− صفيحة سالبة',590,274);
   x.fillStyle='#94a3b8';bg.forEach(d=>{d.y+=d.v;if(d.y>250)d.y=80;x.beginPath();x.arc(d.x,d.y,2.5,0,7);x.fill()});
   x.fillStyle='#f59e0b';x.beginPath();x.arc(380,y,9,0,7);x.fill();x.fillStyle='#2563eb';for(let k=0;k<n;k++){const a=k*6.28/n;x.beginPath();x.arc(380+14*Math.cos(a),y+14*Math.sin(a),3.5,0,7);x.fill()}
   if(n*E>0)ar(404,y-4,'#2563eb',-Math.min(90,n*E/60*28));ar(404,y+4,'#64748b',28)})}},
{t:'تقويم: الذرة والإلكترون',h:()=>QZ([
['أصغر جزء يحتفظ بخواص العنصر هو','الذرة','الجزيء','الإلكترون','النواة','تعريف الذرة.'],
['عدد ذرات قطعة عملة نحاسية صلبة تقريبًا','2.9×10²²','6.5×10⁹','1.28×10⁻¹⁰','9.1×10⁻²⁸','يقدَّر بحوالي 2.9×10²² ذرة.'],
['قطر ذرة النحاس يقارب','1.28×10⁻¹⁰ m','6.5×10⁹ m','2.9×10²² m','1 m','قطرها 1.28×10⁻¹⁰ متر.'],
['الجهاز الذي يسمح برؤية الذرات المنفردة','المجهر الأنبوبي الماسح STM','المجهر الضوئي','التلسكوب','أنبوب أشعة المهبط','STM يعطي صورة سطحية على المستوى الذري.'],
['القطب الموصول بالطرف الموجب للبطارية يسمى','المصعد (الأنود)','المهبط (الكاثود)','الفوسفور','المغناطيس','المصعد = موجب والمهبط = سالب.'],
['تنحرف أشعة المهبط نحو الصفيحة الموجبة لأنها','سالبة الشحنة','موجبة الشحنة','متعادلة','بلا كتلة','الشحنة السالبة تنجذب للموجب.'],
['لم تتأثر أشعة المهبط بتغيير معدن الأقطاب، فاستُنتج أن الإلكترونات','موجودة في جميع أشكال المادة','خاصة بالنحاس','موجودة في الهواء فقط','مصدرها البطارية','الجسيمات السالبة عامة في كل المواد.'],
['العالم الذي حدّد نسبة شحنة الإلكترون إلى كتلته','طومسون','مليكان','رذرفورد','شادويك','تجارب طومسون على أشعة المهبط.'],
['شحنة الإلكترون التي حددها مليكان','1.602×10⁻¹⁹ C','9.11×10⁻²⁸ C','1.673×10⁻²⁴ C','1840 C','من تجربة قطرة الزيت.'],
['كتلة الإلكترون تساوي من كتلة ذرة الهيدروجين','1/1840','1/18','1840 مرة','النصف','9.1×10⁻²⁸ g أي 1/1840.']],'اختبر نفسك: الذرة والإلكترون')},
{t:'نموذج طومسون وتطور النظرية',h:()=>`
<div class="g2"><div class="pn bl"><h3>نموذج طومسون للذرة</h3><svg viewBox="-150 -150 300 300" style="max-width:300px;display:block;margin:auto"><defs><radialGradient id="rg"><stop offset="0" stop-color="#d9f99d"/><stop offset="1" stop-color="#86efac"/></radialGradient></defs><circle r="140" fill="url(#rg)" stroke="#65a30d" stroke-width="2"/><g id="ps"></g><g id="es"></g></svg><p>كرة <b>موجبة الشحنة موزعة بانتظام</b> تنغرس فيها إلكترونات سالبة. الذرة متعادلة، لكن النموذج لم يفسّر ما المسؤول عن كتلة الذرة.</p></div>
<div class="pn"><h3>من الكتاب</h3><figure><img class="brt" src="${IM.thom}" alt=""><figcaption>الشكل 9-3 نموذج طومسون</figcaption></figure>${FQ('أي مما يلي يصف نموذج طومسون؟','كرة موجبة الشحنة فيها إلكترونات',['نواة صغيرة كثيفة','إلكترونات في مدارات محددة','كرة متعادلة بلا إلكترونات'],'شبّهه العلماء بكرة موجبة غُرست فيها الإلكترونات.')}</div></div>
<div class="pn pu"><h3>التدرج التاريخي لدراسة تركيب الذرة</h3><div class="tl" id="tl"></div><div class="tc" id="tc"></div><div class="ctl"><button class="gb" id="tpl">▶ تشغيل الخط الزمني</button></div></div>`,
 i:()=>{let o='',p='';for(let k=0;k<12;k++){const r=118*Math.sqrt((k+.5)/12),a=k*2.4,X=r*Math.cos(a),Y=r*Math.sin(a);o+=`<g transform="translate(${X.toFixed(1)},${Y.toFixed(1)})"><g class="wb" style="--dx:${(k%3-1)*9}px;--dy:${(k%4-1.5)*7}px;animation-delay:${k*.25}s"><circle r="11" fill="#f97316"/><rect x="-6" y="-1.5" width="12" height="3" fill="#fff"/></g></g>`}
  for(let a=-120;a<=120;a+=40)for(let b=-120;b<=120;b+=40)if(a*a+b*b<115*115)p+=`<text class="pl" x="${a+14}" y="${b+4}" font-size="16" fill="#4d7c0f" opacity=".4">+</text>`;$('#es').innerHTML=o;$('#ps').innerHTML=p;
  const TL=[['1897','طومسون يكتشف الإلكترون','باستعمال أنبوب أشعة المهبط اكتشف الإلكترونات وحدّد نسبة كتلة الإلكترون إلى شحنته الكهربائية.'],['1911','رذرفورد ونواة الذرة','من تجربة صفيحة الذهب حدّد خواص النواة: الشحنة والحجم والكثافة.'],['1913','نيلز بور','نشر نظرية عن تركيب الذرة تربط التوزيع الإلكتروني للذرات بخواصها الكيميائية.'],['1932','شادويك والنيوترون','أثبت جيمس شادويك وجود النيوترونات.'],['1932','مسرّع الجسيمات','أُطلقت بروتونات على أنوية الليثيوم لتفتيتها إلى أنوية هيليوم وتحرير الطاقة.'],['1938','الانشطار النووي','نجح ليزا مايتنر وأوتو هان وفريتز شتراسمان في شطر ذرات اليورانيوم.'],['1939-45','أول سلاح نووي','عمل العلماء في الولايات المتحدة وألمانيا بشكل منفصل على مشاريع لتطوير أول سلاح نووي.'],['1954','سيرن CERN','تمت في سيرن بسويسرا دراسة فيزياء الجسيمات.'],['1968','الكواركات','أول دليل تجريبي على الجسيمات المكوّنة لنواة الذرة، وعُرفت بالكواركات.'],['2007','سيرن اليوم','دُرست خواص الجسيمات المكوّنة للذرة والمادة النووية.']];let c=0;
  const sel=k=>{c=k;document.querySelectorAll('#tl button').forEach((b,j)=>b.classList.toggle('on',j===k));$('#tc').innerHTML=`<b>${TL[k][0]} م — ${TL[k][1]}</b><br>${TL[k][2]}`};
  $('#tl').innerHTML=TL.map((t,k)=>`<button data-k="${k}">${t[0]}</button>`).join('');$('#tl').onclick=e=>{const b=e.target.closest('button');if(b){clearInterval(TM);sel(+b.dataset.k)}};
  $('#tpl').onclick=()=>{clearInterval(TM);sel(0);TM=setInterval(()=>{if(c>=TL.length-1)clearInterval(TM);else sel(c+1)},2600)};sel(0)}},
{t:'تجربة رذرفورد والنواة',h:()=>`
<div class="pn"><h3>أطلق جسيمات ألفا نحو الذرة</h3><canvas id="ru"></canvas><div class="ctl"><button class="gb" id="r0">النموذج المتوقع: طومسون</button><button class="gb on" id="r1">ما لوحظ: نواة رذرفورد</button><button class="gb" id="r2">⏸ إيقاف</button></div><div class="chips" id="rc"></div><p class="mu">محاكاة مبسطة: جسيمات ألفا موجبة الشحنة تتنافر مع النواة الموجبة، فتنحرف أو ترتد.</p></div>
<div class="g2"><div class="pn"><h3>من الكتاب</h3><figure><img src="${IM.gold}" alt=""><figcaption>الشكل 11-3 تجربة رذرفورد</figcaption></figure></div><div class="pn gr"><h3>ماذا استنتج رذرفورد؟</h3><p>• معظم جسيمات ألفا مرت دون انحراف أو بانحراف قليل، فمعظم الذرة <b>فراغ</b> تتحرك فيه الإلكترونات.<br>• انحرفت نسبة قليلة بزاوية كبيرة، وارتدّ عدد قليل جدًا إلى الخلف، فالشحنة الموجبة ومعظم الكتلة في مكان صغير كثيف هو <b>النواة</b>.<br>• قطر الذرة ≈ عشرة آلاف مرة قطر النواة.</p><figure><img src="${IM.fig13}" alt="" style="max-width:260px"><figcaption>الشكل 13-3 نموذج رذرفورد</figcaption></figure></div></div>
${FQ('ارتداد عدد قليل جدًا من جسيمات ألفا إلى الخلف يدل على','وجود نواة صغيرة كثيفة موجبة',['أن الذرة كرة متماثلة','أن الإلكترونات ثقيلة','أن الذرة فارغة تمامًا'],'التنافر مع نواة موجبة كثيفة هو ما يرد الجسيم.')}${FQ('مرور معظم جسيمات ألفا دون انحراف يدل على أن','معظم حجم الذرة فراغ',['الذرة صلبة بالكامل','النواة كبيرة جدًا','الإلكترونات موجبة'],'الذرة معظمها فراغ، والنواة صغيرة جدًا.')}`,
 i:()=>{const x=C2('ru',760,320),W=760,Cx=400,Cy=160,R=125;let m=1,A=[],S=[0,0,0,0],f=0,on=1;
  const el=Array.from({length:10},(_,i)=>{const a=i*2.4,r=R*.88*Math.sqrt((i+.5)/10);return[Cx+r*Math.cos(a),Cy+r*Math.sin(a)]});
  const up=()=>{const T=S[0]||1,P=v=>Math.round(v/T*100);$('#rc').innerHTML=`<div><b>${S[0]}</b>جسيمًا أُطلق</div><div><b>${P(S[1])}%</b>مرّ تقريبًا دون انحراف</div><div><b>${P(S[2])}%</b>انحرف (10°–90°)</div><div><b>${P(S[3])}%</b>ارتدّ إلى الخلف</div>`};
  const md=k=>{m=k;S=[0,0,0,0];A=[];up();$('#r0').classList.toggle('on',!k);$('#r1').classList.toggle('on',!!k)};
  $('#r0').onclick=()=>md(0);$('#r1').onclick=()=>md(1);$('#r2').onclick=e=>{on=!on;e.target.textContent=on?'⏸ إيقاف':'▶ استئناف'};up();
  run(()=>{if(on&&++f%6==0&&A.length<45)A.push({x:20,y:Cy+(Math.random()*2-1)*R*.97,vx:4,vy:0,h:[]});
   x.clearRect(0,0,W,320);x.fillStyle='#64748b';x.fillRect(0,130,22,60);x.font='700 13px Tajawal';x.fillStyle='#fff';x.fillText('ألفا',2,165);
