:root[data-theme="dark"]{--bg:#080c1a;--bgt:rgba(8,12,26,.88);--sf:#121a31;--ink:#e8ecfa;--mu:#9aa6c6;--ln:#26304f;--ac:#8b8bff;--bl:#1a2146;--gr:#0f2c2b;--pu:#271c4a;--am:#3a2f12;--ok:#4fe0a0;--bad:#ff8a93;--okb:#0f3325;--badb:#471a21;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font:500 16px/1.85 Tajawal,'Segoe UI',Tahoma,sans-serif;background:radial-gradient(1000px 480px at 90% -8%,rgba(91,91,240,.2),transparent),radial-gradient(800px 420px at -8% 8%,rgba(6,182,212,.16),transparent),var(--bg);background-attachment:fixed}
.w{max-width:1100px;margin:auto;padding:12px 14px 44px}
.hd{position:relative;overflow:hidden;display:flex;gap:18px;align-items:center;background:linear-gradient(115deg,#241472,#5b5bf0 58%,#06b6d4);color:#fff;border-radius:28px;padding:24px 28px;box-shadow:var(--sh)}.hd>*{position:relative}
.hd h1{margin:2px 0;font:800 2.1rem/1.3 Cairo,Tajawal,sans-serif}.hd p{margin:0;opacity:.9}.tag{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:0 12px;font-size:.82rem;font-weight:700}
.fl{position:absolute;inset:0}.fl i{position:absolute;bottom:-24px;border-radius:50%;background:rgba(255,255,255,.35);animation:up linear infinite}
.nb{position:sticky;top:0;z-index:5;background:var(--bgt);backdrop-filter:blur(12px);margin:10px -14px 0;padding:6px 14px 0;border-bottom:1px solid var(--ln)}
.gp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0}.gp>b{color:var(--mu);font-size:.85rem;min-width:150px}
.ch{display:flex;flex-wrap:wrap;gap:6px}.ch button{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:.1rem .85rem;font:700 .88rem Tajawal,sans-serif;cursor:pointer;transition:.2s}.ch button:hover{border-color:var(--ac)}
.ch button.on{background:linear-gradient(110deg,var(--ac),var(--ac2));border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(91,91,240,.4)}.ch button.q{border-style:dashed}
.pr{height:4px;background:var(--ln);border-radius:9px;margin:6px 0 0;overflow:hidden}.pr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:22px;padding:16px 20px;margin:14px 0;box-shadow:var(--sh);animation:fi .5s both}
.pn.bl{background:var(--bl)}.pn.gr{background:var(--gr)}.pn.pu{background:var(--pu)}.pn.am{background:var(--am)}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:0 16px}
.mu{color:var(--mu);font-size:.9rem}.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.gb,.nv button{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:.3rem 1rem;font:700 .95rem Tajawal,sans-serif;cursor:pointer;transition:.2s}.gb:hover{border-color:var(--ac)}.gb.pri,.nv button{background:linear-gradient(110deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}.gb:disabled{opacity:.45}
.sw{display:flex;gap:8px;align-items:center;font-weight:700}input[type=range]{accent-color:var(--ac)}

.brt{animation:br 4s ease-in-out infinite}

.lst li{animation:fi .5s both;margin:4px 0}#sg{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}#sg i{width:12px;height:12px;border-radius:50%;animation:pop .3s both}

.cmp{background:var(--am);border-radius:14px;padding:8px 14px;font-weight:700;text-align:center;direction:ltr;overflow-x:auto}.stk{display:flex;height:26px;border-radius:99px;overflow:hidden;margin:8px 0;direction:ltr}.stk span{color:#fff;font:700 .78rem/26px Tajawal;text-align:center;transition:width .2s;white-space:nowrap;overflow:hidden}

.sc{font-size:1.4rem;font-weight:800;text-align:center;padding:16px;border-radius:18px;background:var(--okb);margin:14px 0}
.nv{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
@keyframes fi{from{opacity:0;transform:translateY(12px)}}@keyframes pop{from{transform:scale(.2);opacity:0}}@keyframes br{50%{transform:scale(1.05)}}@keyframes pl{50%{opacity:.9}}@keyframes up{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(-260px);opacity:0}}
.pl{animation:pl 2.4s ease-in-out infinite}

<div class="pn gr"><h3>لماذا الكتلة الذرية ليست عددًا صحيحًا؟</h3><p>كتلة الذرة تعتمد على عدد البروتونات والنيوترونات، وكل منها قريب من 1 amu، فقد نتوقع عددًا صحيحًا. لكن <b>الكتلة الذرية للعنصر = متوسط كتل نظائره</b> في الطبيعة، ولنظائره كتل مختلفة، فالمتوسط ليس عددًا صحيحًا. مثال الكلور: 76% كلور-35 و24% كلور-37 ← 35.453 amu.</p><figure><img src="${IM.cl}" alt=""><figcaption>الشكل 18-3: حساب الكتلة الذرية للكلور</figcaption></figure></div>
${FQ('وحدة الكتلة الذرية (amu) تساوي تقريبًا كتلة','بروتون واحد',['إلكترون واحد','ذرة الكربون-12 كاملة','ذرتي هيدروجين'],'1 amu = 1/12 من كتلة الكربون-12 ≈ كتلة بروتون أو نيوترون.')}${FQ('الكتلة الذرية للعنصر هي','متوسط كتل نظائره في الطبيعة',['كتلة أثقل نظائره','عدد البروتونات','العدد الكتلي لنظير واحد'],'لذلك ليست عددًا صحيحًا عادةً.')}`,
 i:()=>{const P=Array.from({length:12},(_,i)=>{const r=19.5*Math.sqrt(i+.5),a=i*2.4;return[r*Math.cos(a),r*Math.sin(a)]}),Q=Array.from({length:12},(_,i)=>{const a=6.283*i/12-1.57;return[88*Math.cos(a),88*Math.sin(a)]});let sp=0;
  $('#cb').innerHTML=P.map((p,i)=>`<circle r="17" fill="${i%2?'#a3e635':'#ef4444'}" stroke="#0003" style="transition:transform 1s;transform:translate(${p[0]}px,${p[1]}px)"/>`).join('');
  const t=()=>$('#ct').textContent=sp?'كل جزء ≈ 1 amu، أي كتلة بروتون أو نيوترون تقريبًا.':'كتلة ذرة الكربون-12 = 12 amu بالضبط (6 بروتونات + 6 نيوترونات).';
  $('#cs').onclick=()=>{sp=!sp;document.querySelectorAll('#cb circle').forEach((c,i)=>{const p=sp?Q[i]:P[i];c.style.transform=`translate(${p[0]}px,${p[1]}px)`;c.setAttribute('stroke',sp&&i==0?'#f59e0b':'#0003');c.setAttribute('stroke-width',sp&&i==0?4:1)});$('#cs').textContent=sp?'↺ اجمعها':'✂ قسّم إلى 12 جزءًا';t()};t()}},
{t:'أين يقع المتوسط؟',h:()=>`
<div class="pn"><h3>اختر عنصرًا وغيّر نسبة نظيره</h3><div class="ch" id="ae"></div><svg id="av" viewBox="0 0 720 250" style="width:100%;max-width:780px;display:block;margin:6px auto;direction:ltr"></svg><div class="ctl" dir="ltr"><button class="gb" id="a0">↺ النسب الطبيعية</button><input type="range" id="as" min="0" max="100" step="0.01" style="flex:1"><b id="ap" style="min-width:150px"></b></div><p id="ah" style="margin:4px 0;font-weight:700"></p><div class="cmp" id="ac"></div><div class="stk" id="ab"></div><p class="mu" id="an"></p></div>
<div class="g2"><div class="pn gr"><h3>كيف نقرأ الرسم؟</h3><p>الدوائر أثقال على قضيب، حجمها يمثل نسبة وجود كل نظير. <b>المتوسط</b> هو نقطة الاتزان (المثلث الذهبي): كلما زادت نسبة نظير اقترب المتوسط منه. الخط الأخضر المتقطع قيمة الكتلة الذرية في الجدول الدوري.</p></div><div class="pn"><figure><img src="${IM.br}" alt=""><figcaption>الشكل 19-3: يُستخرج البروم من مياه البحر الميت</figcaption></figure></div></div>
${FQ('الكلور 76% كلور-35 و24% كلور-37، فمتوسط كتلته الذرية أقرب إلى','كلور-35 لأنه الأكثر وجودًا',['كلور-37 لأنه أثقل','منتصفهما تمامًا','عدد صحيح'],'النظير الأكثر وجودًا يسحب المتوسط نحوه.')}${FQ('كتلة البروم الذرية 79.904 ونظيراه 79 و81 بنسبتين متقاربتين، فنستنتج أن البروم-80','غير متوافر في الطبيعة',['هو الأكثر وجودًا','نسبته 100%','يكتب 80Br فقط'],'المتوسط جاء من نظيرين 79 و81، وليس من نظير كتلته 80.')}${FQ('الفلور كتلته الذرية قريبة جدًا من 19، فالفلور في الطبيعة غالبًا','فلور-19',['خليط متساوٍ من نظيرين','فلور-20','لا نظير له'],'متوسط قريب من عدد صحيح يعني نظيرًا واحدًا سائدًا.')}`,
 i:()=>{let k='Cl',x=0;
  const draw=()=>{const D=AV[k],S=share(D,x),A=avg(D,S),ms=D.I.map(r=>r[1]),lo=Math.min(...ms),hi=Math.max(...ms),pad=Math.max((hi-lo)*.3,.2),X=m=>50+(m-(lo-pad))/(hi-lo+2*pad)*620,dif=A-D.ref,ok=Math.abs(dif)<.01;
   let s=`<line x1="30" x2="690" y1="170" y2="170" stroke="var(--mu)" stroke-width="6" stroke-linecap="round"/><line x1="${X(D.ref)}" x2="${X(D.ref)}" y1="46" y2="170" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6 5"/><text x="${X(D.ref)}" y="34" text-anchor="middle" font-size="14" font-weight="700" fill="#10b981">الجدول الدوري ${D.ref}</text>`;
   D.I.forEach((r,i)=>{const R=Math.max(6,12+36*Math.sqrt(S[i]/100)),cx=X(r[1]);s+=`<circle cx="${cx}" cy="${170-R-3}" r="${R}" fill="${IC[i]}" opacity=".92"/><text x="${cx}" y="${170-2*R-10}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">${r[0]}</text><text x="${cx}" y="192" text-anchor="middle" font-size="12" fill="var(--mu)">${r[1]}</text>`});
   s+=`<polygon points="${X(A)},173 ${X(A)-17},208 ${X(A)+17},208" fill="#f59e0b" stroke="#b45309" stroke-width="2"/><text x="${X(A)}" y="234" text-anchor="middle" font-size="17" font-weight="800" fill="#d97706">المتوسط ${A.toFixed(3)} amu</text>`;
   $('#av').innerHTML=s;$('#ap').textContent=`${D.I[0][0]}: ${x.toFixed(2)}%`;
   $('#ac').innerHTML=bd(D.I.map((r,i)=>`${r[1]} × ${(S[i]/100).toFixed(4)}`).join(' + ')+' = '+D.I.map((r,i)=>(r[1]*S[i]/100).toFixed(3)).join(' + ')+' = <b>'+A.toFixed(3)+' amu</b>');
   $('#ab').innerHTML=D.I.map((r,i)=>`<span style="width:${S[i]}%;background:${IC[i]}">${S[i]>6?S[i].toFixed(1)+'%':''}</span>`).join('');
   $('#ah').innerHTML=D.puz?`لغز: حرّك حتى يصبح المتوسط ${D.ref} — أي النظيرين أكثر وجودًا؟ ${ok?'✓ هو النيتروجين-14 بنسبة ≈ 99.6%':''}`:ok?'✓ هذه النسب الطبيعية: المتوسط يطابق الجدول الدوري':`الفرق عن الجدول الدوري: ${bd(dif.toFixed(3)+' amu')}`;
   $('#an').textContent=D.note||''};
  const sel=e=>{k=e;const D=AV[k];document.querySelectorAll('#ae button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));x=D.I[0][2];$('#as').value=x;draw()};
  $('#ae').innerHTML=Object.keys(AV).map(e=>`<button data-k="${e}">${AV[e].n}</button>`).join('');$('#ae').onclick=e=>{const b=e.target.closest('button');if(b)sel(b.dataset.k)};
  $('#as').oninput=e=>{x=+e.target.value;draw()};$('#a0').onclick=()=>sel(k);sel('Cl')}},
{t:'تدرّب: احسب بنفسك',h:()=>`
<div class="pn pu"><h3>وضع التدريب: الكتلة الذرية بالكسور</h3><p class="mu">اختر مسألة، ثم عوّض الأرقام بنفسك. يمكنك كتابة عملية مثل ${bd('6.015*0.0759')} أو ${bd('7.59/100')} وسيحسبها لك.</p><div class="ch" id="pe"></div></div><div id="pz"></div>`,
 i:()=>{let k='Cl';
  const draw=()=>{const D=AV[k],S=D.I.map(r=>r[2]),A=avg(D,S);
   $('#pz').innerHTML=`<div class="pn"><h3>${D.n} — ${D.s}</h3><table><tr><th>النظير</th><th>الكتلة (amu)</th><th>نسبة الوجود</th></tr>${D.I.map(r=>`<tr><td>${r[0]}</td><td>${bd(r[1])}</td><td>${bd(r[2]+'%')}</td></tr>`).join('')}</table>${D.note?`<p class="mu">${D.note}</p>`:''}</div>
<div class="pn bl"><h3>1) حوّل كل نسبة إلى كسر (النسبة ÷ 100)</h3>${D.I.map(r=>`<div class="rw2">${r[0]}: <input class="num" dir="ltr" inputmode="decimal" data-a="${r[2]/100}" data-t="0.0006" placeholder="مثال: ${r[2]}/100"></div>`).join('')}</div>
<div class="pn bl"><h3>2) إسهام كل نظير = الكتلة × الكسر</h3>${D.I.map(r=>`<div class="rw2">إسهام ${r[0]}: <input class="num" dir="ltr" inputmode="decimal" data-a="${r[1]*r[2]/100}" data-t="0.02" placeholder="الكتلة*الكسر"> amu</div>`).join('')}</div>
<div class="pn bl"><h3>3) الكتلة الذرية = مجموع الإسهامات</h3><div class="rw2"><input class="num" dir="ltr" inputmode="decimal" data-a="${A}" data-t="0.03" placeholder="الإسهام الأول + الثاني"> amu</div>${D.id?`<h3 style="margin-top:12px">4) حدّد العنصر بالجدول الدوري</h3><select id="sl"><option value="">— اختر —</option><option value="Be">البريليوم Be</option><option value="Li">الليثيوم Li</option><option value="B">البورون B</option><option value="He">الهيليوم He</option></select>`:''}</div>
<div class="ctl"><button class="gb pri" id="ck">✓ تحقّق</button><button class="gb" id="hn">💡 تلميح</button><button class="gb" id="rv">👁 اكشف الحل</button><b id="rs"></b></div><div class="pn am" id="ht" hidden>الإسهام = الكتلة × نسبة النظير (ككسر). بعد حساب كل إسهام اجمعها. المتوسط يقع بين كتلتي النظيرين، وأقرب إلى الأكثر وجودًا.</div>`;
   document.querySelectorAll('#pe button').forEach(b=>b.classList.toggle('on',b.dataset.k===k))};
  $('#pe').innerHTML=Object.keys(AV).filter(e=>!AV[e].puz).map(e=>`<button data-k="${e}">${AV[e].n.split(' ')[0]} (${AV[e].s})</button>`).join('');
  $('#pe').onclick=e=>{const b=e.target.closest('button');if(b){k=b.dataset.k;draw()}};
  $('#pz').onclick=e=>{const id=e.target.id,I=[...document.querySelectorAll('#pz input[data-a]')],sl=$('#sl');
   if(id==='ck'){let ok=0,all=I.length+(sl?1:0);I.forEach(n=>{const g=Math.abs(ev(n.value)-+n.dataset.a)<=+n.dataset.t;n.classList.toggle('ok',g);n.classList.toggle('no',!g);ok+=g});if(sl){const g=sl.value==='Li';sl.className=g?'ok':'no';ok+=g}$('#rs').textContent=ok==all?'🎉 ممتاز! كل الخطوات صحيحة.':`صحيح ${ok} من ${all}، راجع الخانات الحمراء.`}
   if(id==='rv'){I.forEach(n=>{n.value=+(+n.dataset.a).toFixed(4);n.className='num ok'});if(sl){sl.value='Li';sl.className='ok'}$('#rs').textContent='هذا هو الحل؛ جرّب مسألة أخرى بنفسك.'}
   if(id==='hn')$('#ht').hidden=!$('#ht').hidden};draw()}},
